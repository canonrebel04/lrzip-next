name: Cross-Platform Build & Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libgcrypt20-dev liblzo2-dev liblz4-dev libzstd-dev libbz2-dev bzip3 libbzip3-dev

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool libgcrypt lzo lz4 zstd bzip2 bzip3

      - name: Build & Test
        run: |
          ./autogen.sh
          ./configure
          make -j$(sysctl -n hw.ncpu 2>/dev/null || nproc)
          ./src/lrzip-next -V
