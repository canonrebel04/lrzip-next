name: Cross-Platform Build & Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libgcrypt20-dev liblzo2-dev liblz4-dev libzstd-dev libbz2-dev libgpg-error-dev
          git clone --depth 1 https://github.com/kspiai/bzip3.git /tmp/bzip3
          cd /tmp/bzip3
          ./autogen.sh && ./configure --prefix=/usr && make -j$(nproc) && sudo make install

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool libgcrypt lzo lz4 zstd bzip2 bzip3

      - name: Build & Test (Linux)
        if: runner.os == 'Linux'
        run: |
          ./autogen.sh
          ./configure
          make -j$(nproc)
          ./src/lrzip-next -V

      - name: Build & Test (macOS)
        if: runner.os == 'macOS'
        run: |
          BREW_PREFIX=$(brew --prefix)
          export CFLAGS="-I$BREW_PREFIX/include"
          export CPPFLAGS="-I$BREW_PREFIX/include"
          export LDFLAGS="-L$BREW_PREFIX/lib"
          ./autogen.sh
          ./configure CFLAGS="-I$BREW_PREFIX/include" CPPFLAGS="-I$BREW_PREFIX/include" LDFLAGS="-L$BREW_PREFIX/lib"
          make -j$(sysctl -n hw.ncpu)
          ./src/lrzip-next -V
